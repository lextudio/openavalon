name: Publish LibreWPF GitHub Packages

# Publish one Windows-and-macOS closure at the same versions as nuget.org. Linux is deliberately
# absent: the Windows job stages win-x64/win-arm64 payloads, and the macOS job adds osx-arm64
# before it creates the packages.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-librewpf-github-packages.yml
      - .gitmodules
      - dist.local.sh
      - LibreWPF
  workflow_dispatch:

# Two closures publishing the same versions would race on upload; queue them.
concurrency:
  group: publish-librewpf-github-packages
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  stage-windows-native:
    name: Stage ${{ matrix.rid }} native payloads
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
            dotnet_architecture: x64
          - rid: win-arm64
            runner: windows-11-arm
            dotnet_architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize nested submodules with long paths
        shell: bash
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --force --recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100-rc.2.26504.105
          architecture: ${{ matrix.dotnet_architecture }}
      - name: Show the pinned .NET 11 RC2 SDK
        shell: bash
        run: dotnet --info
      - name: Verify the native runner architecture
        shell: pwsh
        run: |
          $expected = '${{ matrix.rid }}'.Replace('win-', '')
          $actual = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          if ($actual -ne $expected) { throw "Expected $expected PowerShell, found $actual." }
      # Pinned, hash-verified downloads only (the DX12 scripts verify them on
      # every run). Caching them removes most of the network exposure of a
      # 30-minute job; FreeType stays in a fresh workspace by design.
      - name: Cache pinned DX12 downloads
        uses: actions/cache@v4
        with:
          path: |
            LibreWPF/external/ProGPU/artifacts/progpu-dx12/download/${{ matrix.rid }}
            LibreWPF/external/ProGPU/artifacts/wgpu-native-windows/${{ matrix.rid }}
          key: progpu-dx12-downloads-${{ matrix.rid }}-${{ hashFiles('LibreWPF/external/ProGPU/eng/wgpu-dxc/**') }}
      - name: Build the Windows native payload
        shell: bash
        # The ProGPU script resolves dumpbin.exe from this runner's selected
        # VS installation if the VS 2026 developer shell omits it from PATH.
        run: DIST_LOCAL_TARGET_PLATFORM=windows DIST_LOCAL_STAGE_NATIVE_ONLY=1 DIST_LOCAL_WINDOWS_RIDS=${{ matrix.rid }} ./dist.local.sh
      - name: Upload Windows native payload
        uses: actions/upload-artifact@v4
        with:
          name: progpu-native-windows-${{ matrix.rid }}
          if-no-files-found: error
          path: |
            LibreWPF/external/ProGPU/artifacts/progpu-native/package
            LibreWPF/external/ProGPU/artifacts/progpu-dx12/package

  # Microsoft.DotNet.Wpf.GitHub ships per-RID PresentationCore/DirectWriteForwarder
  # (C++/CLI) that only a Windows host can build; the macOS closure consumes them.
  # Mirrors LibreWPF's own progpu-wpf-sdk.yml windows-managed-runtime job.
  stage-windows-managed-runtime:
    name: Windows managed runtime payload
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize nested submodules with long paths
        shell: bash
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --force --recursive
      - name: Prepare exact framework source dependencies
        shell: bash
        working-directory: LibreWPF
        run: |
          python external/ProGPU/eng/progpu-prepare-framework-sources.py
          echo "ProGpuSourceRoot=${GITHUB_WORKSPACE}/LibreWPF/external/ProGPU/" >> "${GITHUB_ENV}"
          echo "LibreWpfSourceRoot=${GITHUB_WORKSPACE}/LibreWPF/" >> "${GITHUB_ENV}"
          echo "LibreWinFormsSourceRoot=${GITHUB_WORKSPACE}/LibreWPF/external/LibreWinForms/" >> "${GITHUB_ENV}"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: LibreWPF/global.json
      - name: Build Windows PresentationCore and DirectWriteForwarder
        shell: pwsh
        working-directory: LibreWPF
        run: ./eng/progpu-wpf-windows-managed-runtime.ps1 -Configuration Release
      - name: Verify the per-RID managed runtime payload
        shell: bash
        run: |
          for rid in win-x64 win-arm64; do
            for dll in PresentationCore DirectWriteForwarder; do
              test -s "LibreWPF/artifacts/windows-managed-runtime/${rid}/net10.0/${dll}.dll"
            done
          done
      - name: Upload Windows managed runtime
        uses: actions/upload-artifact@v4
        with:
          name: librewpf-windows-managed-runtime
          path: LibreWPF/artifacts/windows-managed-runtime
          if-no-files-found: error

  publish:
    name: Windows and macOS package closure
    runs-on: macos-15
    needs:
      - stage-windows-native
      - stage-windows-managed-runtime
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize nested submodules
        shell: bash
        run: |
          git config --global core.longpaths true
          git submodule sync --recursive
          git submodule update --init --force --recursive
      - uses: actions/setup-dotnet@v6
        with:
          # RC2 builds the packages. Keep .NET 10 installed as well: the
          # package contract must remain consumable by the released SDK.
          dotnet-version: |
            11.0.100-rc.2.26504.105
            10.0.x
          architecture: arm64
      - name: Show the pinned .NET 11 RC2 SDK
        run: dotnet --info
      - name: Expose the pinned SDK to LibreWPF canonical tools
        shell: bash
        run: |
          ln -s "$(dirname "$(command -v dotnet)")" LibreWPF/.dotnet
          test -e LibreWPF/.dotnet/dotnet || test -e LibreWPF/.dotnet/dotnet.exe
      - name: Download the Windows native payloads
        uses: actions/download-artifact@v4
        with:
          pattern: progpu-native-windows-*
          merge-multiple: true
          path: LibreWPF/external/ProGPU/artifacts
      # The package preflight requires the FreeType and private EDIT ICU inputs
      # for every RID, so build them exactly as ProGPU's own release does.
      - name: Download the Windows managed runtime payload
        uses: actions/download-artifact@v4
        with:
          name: librewpf-windows-managed-runtime
          path: LibreWPF/artifacts/windows-managed-runtime
      - name: Build the ProGPU macOS ARM64 native payload
        shell: bash
        run: |
          progpu=LibreWPF/external/ProGPU
          # The FreeType producer verifies the release signature with gpg.
          command -v gpg >/dev/null || brew install gnupg
          workspace="$(mktemp -d "${RUNNER_TEMP}/progpu-native-inputs.XXXXXXXX")"
          workspace="$(cd "${workspace}" && pwd -P)"
          python3 "${progpu}/eng/progpu-prepare-freetype.py" \
            --workspace "${workspace}/freetype" --rid osx-arm64 --cc clang --cxx clang++ \
            --test-font /System/Library/Fonts/Supplemental/Arial.ttf
          icu_archive="$(python3 tools/fetch-progpu-edit-word-icu.py "${progpu}" "${workspace}/edit-icu")"
          # The builder accepts dependency inputs only before --build-only.
          "${progpu}/eng/build-progpu-native.sh" \
            --font-manifest "${workspace}/freetype/install/progpu-freetype.json" \
            --edit-word-icu-archive "${icu_archive}" \
            --build-only --rid osx-arm64
      - name: Aggregate native package input diagnostics
        run: python3 LibreWPF/external/ProGPU/eng/progpu-preflight-native-package.py --root LibreWPF/external/ProGPU/artifacts --rids win-x64 win-arm64 osx-arm64
      - name: Verify the supported native payloads
        shell: bash
        run: |
          native_root=LibreWPF/external/ProGPU/artifacts/progpu-native/package/runtimes
          dx12_root=LibreWPF/external/ProGPU/artifacts/progpu-dx12/package
          for path in \
            win-x64/native/progpu_native.dll \
            win-x64/native/progpu_native_dawn.dll \
            win-x64/native/progpu_native_direct2d.dll \
            win-arm64/native/progpu_native.dll \
            win-arm64/native/progpu_native_dawn.dll \
            win-arm64/native/progpu_native_direct2d.dll \
            osx-arm64/native/libprogpu_native.dylib \
            osx-arm64/native/libprogpu_native_dawn.dylib; do
            test -s "${native_root}/${path}"
          done
          for rid in win-x64 win-arm64; do
            for name in wgpu_native.dll dxcompiler.dll dxil.dll; do
              test -s "${dx12_root}/${rid}/native/${name}"
            done
          done
          for excluded_rid in linux-x64 linux-arm64 osx-x64; do
            test ! -e "${native_root}/${excluded_rid}"
          done
          for path in win-x64/native/progpu_native.dll win-x64/native/progpu_native_dawn.dll win-x64/native/progpu_native_direct2d.dll; do
            file "${native_root}/${path}" | grep -Eq 'x86-64|x86_64'
          done
          for path in win-arm64/native/progpu_native.dll win-arm64/native/progpu_native_dawn.dll win-arm64/native/progpu_native_direct2d.dll; do
            file "${native_root}/${path}" | grep -Eqi 'Aarch64|ARM64'
          done
      - name: Build the macOS ARM64 package closure
        env:
          DIST_LOCAL_FEED: ${{ runner.temp }}/librewpf-github-feed
          DIST_LOCAL_FORCE: '1'
        run: ./dist.local.sh
      - name: Verify LibreWPF.Sdk remains consumable by .NET 10
        shell: bash
        env:
          DIST_LOCAL_FEED: ${{ runner.temp }}/librewpf-github-feed
        run: |
          consumer_dir="${RUNNER_TEMP}/librewpf-net10-consumer"
          mkdir -p "${consumer_dir}"
          shopt -s nullglob
          sdk_packages=("${DIST_LOCAL_FEED}"/LibreWPF.Sdk.[0-9]*.nupkg)
          if [[ ${#sdk_packages[@]} -ne 1 ]]; then
            echo "Expected one LibreWPF.Sdk package in ${DIST_LOCAL_FEED}, found ${#sdk_packages[@]}." >&2
            exit 1
          fi
          sdk_package_name="$(basename "${sdk_packages[0]}")"
          sdk_package_version="${sdk_package_name#LibreWPF.Sdk.}"
          sdk_package_version="${sdk_package_version%.nupkg}"
          cat > "${consumer_dir}/global.json" <<'EOF'
          {
            "sdk": {
              "version": "10.0.100",
              "rollForward": "latestFeature"
            }
          }
          EOF
          cat > "${consumer_dir}/NuGet.Config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="librewpf-local" value="${DIST_LOCAL_FEED}" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          cat > "${consumer_dir}/Net10Consumer.csproj" <<EOF
          <Project Sdk="LibreWPF.Sdk/${sdk_package_version}">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <UseWPF>true</UseWPF>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
            </PropertyGroup>
          </Project>
          EOF
          cat > "${consumer_dir}/Program.cs" <<'EOF'
          using System;

          internal static class Program
          {
              [STAThread]
              private static void Main()
              {
              }
          }
          EOF
          (
            cd "${consumer_dir}"
            consumer_sdk_version="$(dotnet --version)"
            case "${consumer_sdk_version}" in
              10.*) ;;
              *) echo "Expected the .NET 10 SDK consumer, got ${consumer_sdk_version}." >&2; exit 1 ;;
            esac
            NUGET_PACKAGES="${consumer_dir}/packages" \
              dotnet build Net10Consumer.csproj --configfile NuGet.Config -v:minimal
            restored_metadata="${consumer_dir}/packages/librewpf.sdk/${sdk_package_version}/.nupkg.metadata"
            if [[ ! -f "${restored_metadata}" ]] || ! grep -Fq "${DIST_LOCAL_FEED}" "${restored_metadata}"; then
              echo "LibreWPF.Sdk was not restored from this run's local feed." >&2
              exit 1
            fi
          )
      - name: Publish the package closure to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          DIST_LOCAL_FEED: ${{ runner.temp }}/librewpf-github-feed
        run: |
          shopt -s nullglob
          packages=("${DIST_LOCAL_FEED}"/*.0.1.0-preview.69.nupkg)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No 0.1.0-preview.69 packages were produced." >&2
            exit 1
          fi
          version_package="${DIST_LOCAL_FEED}/LibreWPF.Interop."*.nupkg
          if [[ ! -f "${version_package}" ]]; then
            echo "Unable to derive the package version from LibreWPF.Interop." >&2
            exit 1
          fi
          package_version="${version_package#${DIST_LOCAL_FEED}/LibreWPF.Interop.}"
          package_version="${package_version%.nupkg}"
          required=(
            LibreWPF.Interop LibreWPF.ProGPU LibreWPF.Sdk LibreWPF.Transport
            LibreWinForms.ProGPU LibreWinForms.Sdk LibreWinForms.System.Windows.Forms LibreWinForms.WindowsFormsIntegration
            ProGPU.Avalonia ProGPU.Backend ProGPU.Backend.Dawn ProGPU.Backend.Dx12 ProGPU.Backend.Native ProGPU.Native.Sdk ProGPU.Compute
            ProGPU.DirectX ProGPU.Layout ProGPU.Media ProGPU.Media.Scene ProGPU.Scene ProGPU.SkiaSharp
            ProGPU.System.Drawing.Common ProGPU.Text ProGPU.Text.Shaping ProGPU.Transpiler ProGPU.Vector
            ProGPU.Virtualization ProGPU.WinRT ProGPU.WinUI
          )
          for id in "${required[@]}"; do
            if [[ ! -f "${DIST_LOCAL_FEED}/${id}.${package_version}.nupkg" ]]; then
              echo "Missing required package ${id}.${package_version}.nupkg" >&2
              exit 1
            fi
          done
          deleted_packages=()
          missing_package_names=()
          publish_failed() {
            if [[ ${#deleted_packages[@]} -gt 0 ]]; then
              echo "Package replacement failed after deleting: ${deleted_packages[*]}. Re-run this workflow to restore the complete preview closure." >&2
            fi
          }
          trap publish_failed ERR
          # GitHub Packages versions are immutable. Replace only the package
          # IDs produced by this run at the public preview version, so this
          # feed cannot silently retain a prior macOS-only closure.
          for package in "${packages[@]}"; do
            package_name="$(basename "${package}" .${package_version}.nupkg)"
            error_file="$(mktemp -t progpu-package-query)"
            if ! version_ids="$(gh api --paginate \
              "/orgs/lextudio/packages/nuget/${package_name}/versions?per_page=100" \
              --jq '.[] | select(.name == "'"${package_version}"'") | .id' 2>"${error_file}")"; then
              if grep -q 'HTTP 404' "${error_file}"; then
                rm -f "${error_file}"
                missing_package_names+=("${package_name}")
                continue
              fi
              cat "${error_file}" >&2
              rm -f "${error_file}"
              exit 1
            fi
            rm -f "${error_file}"
            for version_id in ${version_ids}; do
              gh api --method DELETE \
                "/orgs/lextudio/packages/nuget/${package_name}/versions/${version_id}"
              deleted_packages+=("${package_name}")
            done
          done
          for package in "${packages[@]}"; do
            if ! dotnet nuget push "${package}" \
              --source https://nuget.pkg.github.com/lextudio/index.json \
              --api-key "${GITHUB_TOKEN}"; then
              package_name="$(basename "${package}" .${package_version}.nupkg)"
              if [[ " ${missing_package_names[*]} " == *" ${package_name} "* ]]; then
                echo "${package_name} returned 404 when queried but conflicts on upload; grant this workflow package access, then rerun." >&2
              fi
              publish_failed
              exit 1
            fi
          done
